  h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
  a{color:var(--coral-deep)}
  .script{font-family:var(--script);color:var(--coral);font-weight:400}
  .t-display{font-family:var(--script);color:var(--coral);font-size:38px;line-height:1.1;margin:10px 0 0;font-weight:400}

  .beat:nth-of-type(4n+2){border-radius:var(--w2);transform:rotate(.3deg);animation-delay:.08s}
  .beat:nth-of-type(4n+3){border-radius:var(--w3);transform:rotate(-.25deg);animation-delay:.16s}
  .beat:nth-of-type(4n){border-radius:var(--w4);transform:rotate(.35deg);animation-delay:.16s}
  @keyframes rise{from{opacity:0;translate:0 4px}to{opacity:1}}
  .slotlab{display:block;font-family:var(--script);color:var(--coral);font-size:22px;line-height:1.15;font-weight:400}
  .pickname{font-size:21px;font-weight:700;line-height:1.25;margin-top:1px}
  .why{font-style:italic;font-size:15px;margin:4px 0 0}
  .logi{font-size:13px;color:var(--faded);margin:5px 0 0;font-style:normal}
  .btn{display:inline-flex;align-items:center;background:var(--coral);color:#fff;border:0;border-radius:12px 4px 12px 4px;padding:9px 18px;font-family:var(--serif);font-size:14px;text-decoration:none;margin:10px 8px 0 0;min-height:44px;cursor:pointer}
  .btn.ghost{background:none;color:var(--coral-deep);border:1.3px solid var(--coral)}
  .mist{font-size:13px;color:var(--faded);font-style:italic;margin:10px 0}

  details.alts summary::-webkit-details-marker{display:none}
  .alt{font-size:14px;padding:6px 0 2px}
  .alt b{font-size:14.5px}
  .catlink{font-size:12.5px}

  /* species 2: catalog row */
  .row{border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.off{opacity:.55}
  .row summary{list-style:none;cursor:pointer;padding:12px 0;min-height:44px}
  .row summary::-webkit-details-marker{display:none}
  .row summary::after{content:"⌄";float:right;color:var(--faded);font-size:13px;margin-top:-20px}
  .row[open] summary::after{content:"⌃"}
  .row h3{font-size:17px;display:inline}
  .rowtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .meta{font-size:12.5px;color:var(--faded);margin-top:1px}
  .desc{font-style:italic;font-size:14px;margin:3px 0 0}
  .more{padding:0 0 13px}
  .more p{margin:4px 0 0;font-size:14px}
  .annot{font-style:italic;color:var(--olive-deep);font-size:12.5px}
  .safe{color:var(--coral-deep);font-size:13.5px;margin-top:6px;font-style:normal}
  .st{font-size:12.5px;font-style:italic;white-space:nowrap;color:var(--faded)}
  .st .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--olive);vertical-align:1px;margin-right:4px}

  .grp{margin:8px 0}
  .grp > summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .grp > summary::-webkit-details-marker{display:none}
  .grp > summary .chev{margin-left:auto;color:var(--faded);font-size:13px}

  .ess-strip{display:flex;justify-content:space-between;gap:4px;border-top:1.2px solid var(--ink);border-bottom:1.2px solid var(--ink);padding:6px 0;margin:26px 0 10px}
  .ess-strip>*{background:none;border:0;font-family:var(--serif);font-size:13px;color:var(--ink);padding:2px 4px;cursor:default;min-height:44px;display:flex;flex-direction:column;justify-content:center;text-decoration:none;text-align:left;flex:1}

  .ess-strip b{color:var(--coral-deep);font-size:13.5px}
  .ess-strip button,.ess-strip a{cursor:pointer}
  .copyhint{font-size:10px;color:var(--faded);font-style:italic}
  .esscard{border:1.4px solid var(--ink);border-radius:var(--w1);padding:14px 17px;margin:22px 0}
  .esscard .bigv{font-size:19px;font-weight:700;color:var(--coral-deep)}

  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .act{font-size:12.5px;border:1.2px solid var(--ink);border-radius:999px;padding:9px 13px;text-decoration:none;color:var(--ink);font-family:var(--serif);min-height:40px;display:inline-flex;align-items:center}

  .stayrow>label{flex:1;min-width:0}
  .contactrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
  .cbtn{flex:1;min-width:100px;text-align:center;border:1.3px solid var(--ink);color:var(--ink);border-radius:999px;padding:11px 10px;font-size:13.5px;text-decoration:none;font-family:var(--serif);background:none;min-height:44px}

  .seas{border-left:2.5px solid var(--olive);padding:2px 0 2px 13px;font-size:14px;margin:8px 0}
  .seas b{display:block;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive-deep)}
  .evt{display:flex;gap:13px;padding:10px 0;border-bottom:1px solid var(--line)}
  .evt:last-child{border-bottom:0}
  .evt .when{min-width:52px;text-align:center;border:1.2px solid var(--ink);border-radius:10px 3px 10px 3px;padding:5px 4px;height:fit-content}

  .evt h3{font-size:16px}
  .evt p{margin:2px 0 0;font-size:13.5px;color:var(--faded)}
  .scene{display:block;margin:8px auto 0;max-width:100%}
  .divid{display:block;margin:26px auto 0}
  .mark{vertical-align:-2px;margin-right:5px}
</style>

/* ===================== DAY STRIP (scroll-snap shelf) ===================== */
function dayStrip(c, sc) {
  if (picked.has("oneNight") || sc.days.length < 2) return "";
  const days = sc.days.slice(0, 8);
  const lastMid = +midOf(sc.days[sc.days.length - 1]);
  const firstMid = +midOf(sc.days[0]);
  const cards = days.map((d, i) => {
    const dm = +midOf(d);
    if (dm < +c.mid) return "";
    const wd = d.getDay(), m = d.getMonth() + 1;
    const isArr = dm === firstMid, isOut = dm === lastMid && sc.days.length > 1;
    const isToday = dm === +c.mid;
    const pastBk = isToday && c.min >= 660;    /* breakfast is over for today */
    const pastAct = isToday && c.min >= 1020;  /* day activity window closed */
    const bits = [];
    if (!isArr && !isOut && !pastBk) {
      const b = rotatePick(mealPool("breakfast", wd, 510, m), null, i);
      if (b) bits.push(inkMark("mug") + esc(b.name));
    }
    if (!isOut) {
      const act = rotatePick(actPool(d, { midday: heatMonth(m), tripsOK: sc.nights >= 3 || picked.has("adventure") }), null, i);
      if (act && !isArr && !pastAct) bits.push(inkMark("boot") + esc(act.name));
      const dprobe = isToday ? Math.max(c.min, 1110) : 1110;
      const din = rotatePick(mealPool("dinner", wd, dprobe, m), null, i);
      if (din) bits.push(inkMark("fork") + esc(din.name));
    } else {
      const b = rotatePick(mealPool("breakfast", wd, 510, m), null, i);
      bits.push(inkMark("mug") + (b ? esc(b.name) : "an easy morning"));
      bits.push("keys in the box by 11");
    }
    const evs = DATA.events.filter(e => e.cadence === "weekly" && e.weekday === wd && !(e.adult && picked.has("family")))
      .filter(e => !(isArr && (e.end == null ? 1440 : e.end) <= 900) && !(isOut && (e.start == null ? 0 : e.start) >= 660));
    if (evs.length) bits.push(`<span style="color:var(--coral-deep)">${esc(evs[0].name)}</span>`);
    return `<div class="dcard ${isToday ? "today" : ""}">
      <span class="dname">${isToday ? "Today" : DAY_ABBR[wd] + " " + d.getDate()}</span>
      ${bits.slice(0, 3).map(b => `<div>${b}</div>`).join("")}
    </div>`;
  }).join("");
  if (!cards.trim()) return "";
  const wds2 = new Set(sc.days.map(d => d.getDay()));
  const warns = [];
  if ([1, 2, 3].some(x => wds2.has(x))) warns.push("Ewings runs Thu–Sun only");
  if ([2, 3].some(x => wds2.has(x))) warns.push("Airpark Cafe rests Tue & Wed");
  return `<div class="shelf" id="shelf">${cards}</div>
    ${warns.length ? `<p class="logi" style="font-style:italic;margin-top:2px">Worth knowing: ${warns.join(" · ")}.</p>` : ""}`;
}

  const noneLine = sc.days.length ? "A quiet stretch — the town's your own." : "Set your dates on Now and this fills in.";
  return `
    <span class="label">${sc.days.length ? "While you're here" : "This month & beyond"}</span>
    ${here.length ? here.map(x => `<div class="evt"><div class="when"><span class="mo">${MONTHS[x.d.getMonth()]}</span><span class="da">${x.d.getDate()}</span></div>
      <div><h3>${esc(x.e.name)}</h3><p>${esc(x.e.blurb)}</p></div></div>`).join("") : `<p class="why">${noneLine}</p>`}
    <details class="grp"><summary>The rest of the year <span class="chev">⌄</span></summary>
      ${rest.map(e => { const w = eventNearestLabel(e, c.month); return `<div class="evt"><div class="when"><span class="mo">${esc(w.mo)}</span><span class="da">${esc(w.da)}</span></div>
        <div><h3>${esc(e.name)}</h3><p>${esc(e.blurb)}</p></div></div>`; }).join("")}
      <p class="logi" style="font-style:italic">Dates drift year to year — the desk keeps the current flyer.</p>
    </details>`;
}
function askResults(c, sc) {
  const q = askQuery.trim().toLowerCase();
  if (!q) {
    const topics = [...new Set(DATA.ask.map(x => x.topic))];
    return `<details class="grp"><summary>Browse every question <span class="chev">⌄</span></summary>
      ${topics.map(t => `<details class="grp" style="margin-left:8px"><summary style="font-size:14.5px">${esc(t)} <span class="chev">⌄</span></summary>
        ${DATA.ask.filter(x => x.topic === t).map(x => `<div class="qa"><h3>${esc(x.q)}</h3><p>${esc(x.a)}</p></div>`).join("")}</details>`).join("")}
    </details>`;
  }
  const words = q.split(/\s+/).filter(Boolean);
  const skipEwings = sc.days.length && !sc.days.some(d => [4, 5, 6, 0].includes(d.getDay()));
  const scored = DATA.ask.map(x => {
    const hay = (x.q + " " + x.k + " " + x.a).toLowerCase();
    let s = 0; words.forEach(w => { if (hay.includes(w)) s++; });
    return { x, s };
  }).filter(r => r.s > 0).sort((a, b) => b.s - a.s).slice(0, 6);
  return scored.length
    ? scored.map(r => {
        let a = r.x.a;
        if (r.x.dateNight && skipEwings) a = "Your nights miss the Ewings deck — make the 25-minute canyon drive to Johnny McNally's, the 1941 roadhouse where the valley celebrates.";
        return `<div class="qa"><span class="topic">${r.x.topic}</span><h3>${esc(r.x.q)}</h3><p>${esc(a)}</p></div>`;
      }).join("")
    : `<div class="qa"><h3>Stumped us!</h3><p>That one deserves a real local — call the desk, (760) 376-3733.</p></div>`;
}
function milepost(z) {
  return `<div class="zonehead" id="z${z}">
    <svg width="24" height="40" viewBox="0 0 24 40" fill="none" aria-hidden="true">
      <path d="M12 8 L12 38" stroke="#34322C" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M4 10 L20 6 L20 15 L4 19 Z" fill="#FBEFEA" stroke="#C44F41" stroke-width="1.5"/>
      <text x="12" y="14.5" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#C44F41" font-family="Georgia,serif" transform="rotate(-4 12 12)">${z}</text>
    </svg>
    <div><span class="script" style="font-size:26px">${ZONES[z][0]}</span>
    <div class="meta">${ZONES[z][1]}</div></div>
  </div>`;
}
function waterRow(f) {
  return `<div class="row" style="padding:11px 0">
    <div class="rowtop"><h3 style="font-size:16px">${esc(f.name)}</h3>${f.season ? `<span class="st"><span class="dot"></span>${esc(f.season.toLowerCase())}</span>` : ""}</div>
    <p class="desc" style="font-style:normal">${esc(f.detail)}</p>
    ${f.phone ? actsRow(f.name, { tel: f.phone, maps: false }) : ""}
  </div>`;
}
function practicalCard() {
  const P = DATA.practical;
  const lines = [
    ["Emergencies", "911, always"],
    P.er ? ["Nearest ER", P.er] : null,
    ["Rangers", P.ranger],
    ["Roads", P.roads],
    P.lateFood ? ["Hungry late", P.lateFood] : null,
    P.gas ? ["Gas & late supplies", P.gas] : null,
    P.pharmacy ? ["Pharmacy", P.pharmacy] : null,
    P.grocery ? ["Groceries", P.grocery] : null,
  ].filter(Boolean);
  return `<div class="tick alt2"><span class="label" style="color:var(--coral-deep)">Good to know out here</span>
    ${lines.map(l => `<div style="font-size:13.5px;margin-top:4px"><b>${l[0]}:</b> ${esc(l[1])}</div>`).join("")}
  </div>`;
}
function renderExplore() {
  const c = clock(), sc = stayCtx(c);
  /* the whole valley, hung on one question: how far from your door? */
  const all = [
    ...DATA.eat.map(it => ({ kind: "eat", it })),
    ...DATA.hikes.map(it => ({ kind: "trail", it })),
    ...DATA.deepCuts.map(it => ({ kind: "secret", it })),
    ...DATA.dayTrips.map(it => ({ kind: "trip", it })),
    ...DATA.fishing.map(it => ({ kind: "water", it })),
    ...DATA.rafting.map(it => ({ kind: "water", it })),
  ];
  const passes = x => exFilter === "all" ? true
    : exFilter === "eat" ? x.kind === "eat"
    : exFilter === "trail" ? x.kind === "trail"
    : exFilter === "water" ? (x.kind === "water" || x.it.water)
    : exFilter === "secret" ? x.kind === "secret" : true;
  const present = [];
  const zonesHtml = [1, 2, 3, 4, 5, 6].map(z => {
    let items = all.filter(x => (ZONE_OF[x.it.name] || 9) === z && passes(x));
    if (!items.length) return "";
    present.push(z);
    items.sort((a, b) => ((b.it.star ? 1 : 0) - (a.it.star ? 1 : 0))
      || ((!a.it.months || a.it.months.includes(c.month)) ? 0 : 1) - ((!b.it.months || b.it.months.includes(c.month)) ? 0 : 1)
      || fitScore(b.it.goodFor || b.it.tags) - fitScore(a.it.goodFor || a.it.tags));
    /* lead with the best three; the rest wait behind one tap so the page stays walkable */
    const open = exOpen.has(z), CAP = 3, deep = items.length > CAP + 1;
    const show = (deep && !open) ? items.slice(0, CAP) : items;
    const rows = show.map(x =>
      x.kind === "eat" ? eatRow(x.it, c)
      : x.kind === "water" ? waterRow(x.it)
      : catRow({ ...x.it, kind: x.kind === "trail" ? "hike" : x.kind }, c, x.kind === "trip" ? x.it.drive : null)
    ).join("");
    const more = !deep ? ""
      : `<button class="morez" data-exz="${z}">${open ? "Show fewer" : "See all " + items.length + " ›"}</button>`;
    return milepost(z) + rows + more;
  }).join("");
  /* today's house secret, up top */
  const dayN = Math.floor(+c.mid / 864e5);
  const eligible = DATA.deepCuts.filter(d => inSeason(d, c.month));
  const feat = (exFilter === "all" || exFilter === "secret") && eligible.length ? eligible[dayN % eligible.length] : null;
  return `
    <div class="t-display">Explore</div>
    <p class="logi">The valley, laid out by how far it is from your door.</p>
    <p class="logi" style="font-style:italic;margin-top:6px">Downtown is a 15-minute stroll south, the lake 10 minutes past that, and the canyon runs 20 wild miles north.</p>
    <div class="contactrow" style="margin-top:8px">
      <a class="cbtn" href="${DATA.lodge.mapUrl}" target="_blank" rel="noopener">Open us in your maps app</a>
    </div>
    <div class="chips" style="margin-top:12px">${[["all", "Everything"], ["eat", "Eat & drink"], ["trail", "Trails"], ["water", "On the water"], ["secret", "Local secrets"]].map(([k, l]) =>
      `<button class="chip ${exFilter === k ? "on" : ""}" data-exf="${k}">${l}</button>`).join("")}</div>
    ${present.length > 1 ? `<div class="zjump">${present.map(z =>
      `<button data-jump="${z}">${ZONES[z][2]}</button>`).join("")}</div>` : ""}
    ${feat ? `<span class="label" style="display:block;margin-top:16px">Today's house secret</span>
      <div class="beat"><span class="slotlab">Psst</span>
        <div class="pickname">${esc(feat.name)}</div>
        <p class="why">${esc(feat.blurb)}</p>
        <p class="logi">${esc(feat.practical || "")}</p>
        ${feat.safety ? `<p class="safe"><b>Know before you go:</b> ${esc(feat.safety)}</p>` : ""}
        ${actsRow(feat.name, { mapsQ: feat.mapq, tel: feat.phone })}</div>
      <p class="logi" style="font-style:italic;margin-top:-14px">A new one surfaces each morning — more secrets than nights in your stay.</p>` : ""}
    ${zonesHtml}
    ${squiggle()}
    <span class="label" style="display:block">The year in Kernville</span>
    ${exploreEvents(c, sc)}
    <details class="grp"><summary>Shops — downtown, walkable <span class="chev">⌄</span></summary>
      <p class="desc">${esc(DATA.shops.intro)}</p>
      ${DATA.shops.groups.map(g => `<div class="row" style="padding:10px 0"><h3 style="font-size:15px">${esc(g.title)}</h3>
        ${g.list.map(s => `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span>${esc(s)}</span><a class="act" href="${mapsQ(s)}" target="_blank" rel="noopener">Directions</a></div>`).join("")}</div>`).join("")}
    </details>
    <details class="grp"><summary>Wildlife & the seasons <span class="chev">⌄</span></summary>
      <div class="note bearRow">${bearSvg}<div><p style="margin:0"><b>About the bears:</b> ${esc(DATA.bearLine)}</p>
      <p style="margin:6px 0 0"><a href="${DATA.bearLink}" target="_blank" rel="noopener">${esc(DATA.bearLinkLabel)}</a></p>
      <p class="logi" style="margin:6px 0 0">Bold bear on the property? Tell the front desk.</p></div></div>
      ${DATA.wildlife.map(w => `<div class="row" style="padding:10px 0"><h3 style="font-size:15.5px">${esc(w.name)}</h3><p class="desc" style="font-style:normal">${esc(w.facts)}</p><p class="safe" style="font-size:13px">${esc(w.safety)}</p></div>`).join("")}
      <p style="font-size:14px;font-style:italic;margin-top:10px">${esc(DATA.snowAnswer)}</p>
      ${["spring", "summer", "fall", "winter"].map(s => `<div class="seas"><b>${s}${s === seasonOf(c.month) ? " · now" : ""}</b>${esc(DATA.seasons[s])}</div>`).join("")}
    </details>
    ${practicalCard()}
    <input id="askSearch" class="askbox" placeholder="Ask us anything — bears, breakfast, hot springs…" aria-label="Ask anything" value="${esc(askQuery)}" autocomplete="off">
    <div id="askResults">${askResults(c, sc)}</div>
    <p class="logi" style="font-style:italic">The real experts are at the desk — (760) 376-3733 · Sun–Thu 11–5, Fri–Sat 10–6.</p>
    ${trailScene}`;
}

/* ===================== THE LODGE ===================== */
/* NOTE: wifi/pool codes and the FitHaus perk deliberately live ONLY on the Now
   screen's essentials card — Ryan: "why are we doing these 2 things on 2 of the 3
   pages at the top! stop that!" Now is the default tab, so it's the canonical home. */
function renderLodge() {
  const c = clock(), sc = stayCtx(c);
  return `
    <div class="t-display">The Lodge</div>
    <p class="logi">Est. 1950s · eight acres on the Kern</p>
    <div class="contactrow" style="margin-top:14px">
      <a class="cbtn call" href="${telHref(DATA.lodge.phone)}">Call the desk · ${DATA.lodge.phone}</a>
    </div>
    <p class="logi">${esc(DATA.lodge.deskHours)}</p>

    <span class="label">In your room</span>
    ${DATA.roomHelp.map(r => `<details class="row"><summary><h3 style="font-size:16px">${esc(r.q)}</h3></summary><div class="more"><p>${esc(r.a)}</p></div></details>`).join("")}
    <div style="margin-top:26px"><span class="label">Good to know</span>
      <ul style="margin:6px 0 0;padding-left:20px;font-size:14px">${DATA.policies.map(p => `<li style="margin:4px 0">${esc(p)}</li>`).join("")}</ul></div>
    ${squiggle()}
    <span class="label">Find your room</span>
    ${lodgeMap()}
    <p class="logi" style="font-style:italic;margin-top:0">Ice: the coral box on the map. Fourteen rooms, most with a balcony of their own — walk-in rate: ask the desk, or <a href="${SMS_DESK}">text us</a>.</p>
    ${roomCard()}
    <details class="row" style="margin-top:14px"><summary><h3 style="font-size:16px">Our story</h3></summary>
      <div class="more"><p>${esc(DATA.story)}</p></div></details>
    <div class="contactrow">
      <a class="cbtn" href="${telHref(DATA.lodge.phone)}">Call</a>
      <a class="cbtn" href="mailto:${DATA.lodge.email}">Email</a>
      <a class="cbtn" href="${DATA.lodge.mapUrl}" target="_blank" rel="noopener">Directions</a>
      <a class="cbtn" href="${DATA.lodge.site}" target="_blank" rel="noopener">${sc.mode === "past" ? "Book again" : "pineskernville.com"}</a>
    </div>
    <p class="logi">${esc(DATA.lodge.address)}</p>
    ${cabinScene}`;
}

/* ===================== SHELL ===================== */
const SCREENS = [
  { id: "now", label: "Now", render: renderNow,
    icon: `<svg width="21" height="21" viewBox="0 0 22 22"><circle cx="11" cy="11" r="4.2"/><path d="M11 2.5v2.2M11 17.3v2.2M2.5 11h2.2M17.3 11h2.2M5 5l1.5 1.5M15.5 15.5L17 17M17 5l-1.5 1.5M6.5 15.5L5 17"/></svg>` },
  { id: "explore", label: "Explore", render: renderExplore,
    icon: `<svg width="21" height="21" viewBox="0 0 22 22"><path d="M11 2.5L5 11h3.4L4 18h14l-4.4-7H17L11 2.5zM11 18v2"/></svg>` },
  { id: "lodge", label: "The Lodge", render: renderLodge,
    icon: `<svg width="21" height="21" viewBox="0 0 22 22"><path d="M3 11l8-7 8 7M5.5 9.2V19h11V9.2M9.5 19v-5h3v5"/></svg>` },
];
/* #v=explore / #v=lodge opens straight to that screen; anything else starts on Now */
let cur = (() => {
  try {
    const v = (new URLSearchParams((location.hash || "").replace(/^#/, "")).get("v")
      || new URLSearchParams(location.search || "").get("v") || "").trim().toLowerCase();
    return SCREENS.some(s => s.id === v) ? v : "now";
  } catch (e) { return "now"; }
})();
function paint(toTop) {
  const y = window.scrollY;
  const c = clock();
  const sc = stayCtx(c);
  document.getElementById("ctxchip").textContent =
    (sc.mode === "arrival" || sc.mode === "full") ? "" : DAY_FULL[c.day] + ", " + MONTHS[c.n.getMonth()] + " " + c.n.getDate();
  document.getElementById("main").innerHTML =
    SCREENS.map(s => `<section class="screen ${s.id === cur ? "on" : ""}">${s.id === cur ? s.render() : ""}</section>`).join("") +
    `<footer>Hours and rivers both change with the seasons —<br>when in doubt, holler at the front desk.</footer>`;
  document.getElementById("nav").innerHTML = SCREENS.map(s =>
    `<button class="${s.id === cur ? "on" : ""}" data-nav="${s.id}" aria-label="${s.label}">${s.icon}<span class="nlabel">${s.label}</span></button>`).join("");
  const sh = document.getElementById("shelf");
  if (sh) { const t = sh.querySelector(".dcard.today"); if (t) sh.scrollLeft = Math.max(0, t.offsetLeft - 12); }
  window.scrollTo({ top: toTop ? 0 : y });
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800);
}
function readWho() { /* pull the sheet's fields into state without repainting */
  const ni = document.getElementById("guestNameInput");
  if (ni) { guestName = cleanName(ni.value); saveName(); }
  const rn = document.getElementById("roomNumInput");
  if (rn) { roomNum = (rn.value || "").replace(/[^\d]/g, "").slice(0, 3); store("wpl-roomnum", roomNum || null); }
  const a = (document.getElementById("stayA") || {}).value, d = (document.getElementById("stayD") || {}).value;
  if (a && d) {
    const da = new Date(a + "T12:00:00"), dd = new Date(d + "T12:00:00");
    if (!isNaN(da) && !isNaN(dd) && dd >= da) { stay = { a, d }; fixSheet = false; saveStay(); }
  } else if (!a && !d) { stay = null; saveStay(); }
}
document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { cur = nav.dataset.nav; paint(true); return; }
  const go = e.target.closest("[data-goto]");
  if (go) { e.preventDefault(); cur = "explore"; exFilter = { eat: "eat", do: "trail", secrets: "secret", events: "all" }[go.dataset.goto] || "all"; exOpen.clear(); paint(true); return; }
  const p = e.target.closest("[data-p]");
  if (p) {
    const id = p.dataset.p;
    picked.has(id) ? picked.delete(id) : picked.add(id);
    savePicked();
    p.classList.toggle("on"); /* patch in place — no mid-flow rebuild */
    return;
  }
  const rm = e.target.closest("[data-room]");
  if (rm) {
    room = room === rm.dataset.room ? "" : rm.dataset.room;
    store("wpl-room", room || null);
    [...rm.parentElement.querySelectorAll(".chip")].forEach(ch => ch.classList.toggle("on", ch.dataset.room === room));
    return;
  }
  const jp = e.target.closest("[data-jump]");
  if (jp) { const el = document.getElementById("z" + jp.dataset.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const xz = e.target.closest("[data-exz]");
  if (xz) { const z = +xz.dataset.exz; exOpen.has(z) ? exOpen.delete(z) : exOpen.add(z); paint(); return; }
  const ex = e.target.closest("[data-exf]");
  if (ex) { exFilter = ex.dataset.exf; exOpen.clear(); paint(); return; }
  const ak = e.target.closest("[data-ask]");
  if (ak) {
    askQuery = ak.dataset.ask;
    const inp = document.getElementById("askSearch");
    if (inp) inp.value = askQuery;
    const r = document.getElementById("askResults");
    if (r) { const c = clock(); r.innerHTML = askResults(c, stayCtx(c)); }
    return;
  }
  if (e.target.closest("[data-savewho]")) { readWho(); paint(true); toast(guestName ? "Pleasure to meet you, " + guestName.split(/\s+/)[0] + "." : "All set."); return; }
  if (e.target.closest("[data-clearall]")) { purgeAll(); fixSheet = false; paint(true); toast("Fresh page."); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const v = cp.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject())
      .then(() => toast("Copied — you're in."))
      .catch(() => toast(v));
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "stayA" || e.target.id === "stayD") {
    /* defer full repaint until both dates set — iOS picker stays open */
    const a = document.getElementById("stayA").value, d = document.getElementById("stayD").value;
    if (a && d) { readWho(); paint(); }
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "askSearch") {
    askQuery = e.target.value;
    const r = document.getElementById("askResults");
    if (r) { const c = clock(); r.innerHTML = askResults(c, stayCtx(c)); }
  }
  if (e.target.id === "guestNameInput") { guestName = cleanName(e.target.value); saveName(); }
});
/* the jump strip marks whichever zone you're standing in as you scroll */
let spyTick = 0;
window.addEventListener("scroll", () => {
  if (cur !== "explore" || spyTick) return;
  spyTick = requestAnimationFrame(() => {
    spyTick = 0;
    const btns = document.querySelectorAll(".zjump [data-jump]");
    if (!btns.length) return;
    let active = "";
    btns.forEach(b => {
      const el = document.getElementById("z" + b.dataset.jump);
      if (el && el.getBoundingClientRect().top <= 84) active = b.dataset.jump;
    });
    btns.forEach(b => b.classList.toggle("on", b.dataset.jump === active));
  });
}, { passive: true });
window.addEventListener("hashchange", () => { ingestParams(); paint(true); });
function safePaint() { /* don't clobber typing, half-entered dates, or an open sheet */
  if (document.hidden) return;
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  const fs = document.getElementById("fixsheet");
  if (fs && fs.open) return;
  const opened = document.querySelector("#main details[open]:not(.grp)");
  if (opened) return;
  paint();
}
document.addEventListener("visibilitychange", safePaint);
setInterval(safePaint, 60000);
paint();
</script>
